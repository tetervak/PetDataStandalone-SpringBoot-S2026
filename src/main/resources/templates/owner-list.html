<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <title>Owner List</title>
</head>
<body>
<header th:replace="~{header-and-footer::Header}">
    <h1>Some header text</h1>
</header>
<main>
    <h2>Owner List</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Link</th>
        </tr>
        <tr th:each="owner: ${owners}">
            <td th:text="${owner.id}"></td>
            <td th:text="${owner.firstName}"></td>
            <td th:text="${owner.lastName}"></td>
            <td><a th:href="@{/owners/{id}(id=${owner.id})}">View</a></td>
        </tr>
    </table>
    <p th:if="${#lists.isEmpty(owners)}" class="error">
        No pet owners found.
    </p>
    <p>
        <a th:href="@{/index}">Index</a>
    </p>
</main>
<footer th:replace="~{header-and-footer::footer}">
    Some footer text
</footer>
</body>
</html>
